title: "Grupo de Estudos em Etnobotânica — JBRJ"
description: >-
  Site do Grupo de Estudos em Etnobotânica do Instituto de Pesquisas
  Jardim Botânico do Rio de Janeiro (JBRJ) — coleções, publicações,
  eventos e a Coleção Viva de plantas medicinais.
lang: pt-BR

# ATENÇÃO: troque pela URL real quando o GitHub Pages estiver ativo
url: "https://etnobotanicajbrj.github.io"
baseurl: "/site-principal"

markdown: kramdown
permalink: pretty

collections:
  publicacoes:
    output: true
    permalink: /publicacoes/:path/
  eventos:
    output: true
    permalink: /eventos/:path/
  plantas:
    output: true
    permalink: /colecoes/ctpm/colecao-viva/:path/

defaults:
  - scope:
      path: ""
      type: "publicacoes"
    values:
      layout: "publicacao"
  - scope:
      path: ""
      type: "eventos"
    values:
      layout: "publicacao"
  - scope:
      path: ""
      type: "plantas"
    values:
      layout: "planta"
  - scope:
      path: ""
    values:
      layout: "default"

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - licencas/
  - estrutura-site-etnobotanica.md
  - quadro-kanban-github-projects.md
  - vendor/

# ===========================================================
# DATAS EM PORTUGUÊS
# ===========================================================

# Configuração de locale para português
lang: pt-BR

# Formato de data padrão
date_format: "%d/%m/%Y"

# Mapeamento de meses para português (usado nos filtros date)
month_names:
  - Janeiro
  - Fevereiro
  - Março
  - Abril
  - Maio
  - Junho
  - Julho
  - Agosto
  - Setembro
  - Outubro
  - Novembro
  - Dezembro

month_abbr:
  - Jan
  - Fev
  - Mar
  - Abr
  - Mai
  - Jun
  - Jul
  - Ago
  - Set
  - Out
  - Nov
  - Dez
