title: "Grupo de Estudos em Etnobotânica — JBRJ"
description: >-
  Site do Grupo de Estudos em Etnobotânica do Instituto de Pesquisas
  Jardim Botânico do Rio de Janeiro (JBRJ) — coleções, publicações,
  eventos e a Coleção Viva de plantas medicinais.
lang: pt-BR

url: "https://etnobotanicajbrj.github.io"
baseurl: "/site-principal"

markdown: kramdown
permalink: pretty

menu:
  - title: "Página Inicial"
    url: "/"

  - title: "Coleções"
    url: "/colecoes/"
    submenu:
      - title: "Coleção Temática de Plantas Medicinais"
        url: "/colecoes/ctpm/"
        submenu:
          - title: "Plantas da Coleção Viva"
            url: "/colecoes/ctpm/colecao-viva/"
          - title: "Visite a Coleção"
            url: "/colecoes/ctpm/visite/"
      - title: "Coleção de Etnobotânica (RBetno)"
        url: "/colecoes/rbetno/"

  - title: "Publicações"
    url: "/publicacoes/"

  - title: "Eventos e Visitas"
    url: "/eventos/"

  - title: "Quem Somos"
    url: "/quem-somos/"
    submenu:
      - title: "Grupo de Pesquisa"
        url: "/quem-somos/grupo-pesquisa/"
      - title: "Programa de Extensão"
        url: "/quem-somos/programa/"
      - title: "Nossa Equipe"
        url: "/quem-somos/equipe/"
      - title: "Compromissos"
        url: "/quem-somos/compromissos/"

  - title: "Contato e Visitas"
    url: "/contato/"

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - licencas/
  - estrutura-site-etnobotanica.md
  - quadro-kanban-github-projects.md
  - vendor/
